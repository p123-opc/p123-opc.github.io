<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>航电维修工具库 · 数据分离版</title>
    <style>
        /* 完整保留原有样式，无修改 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #eef2f5;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app-container {
            max-width: 1800px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,20,40,0.12);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            overflow: hidden;
        }
        header {
            padding: 10px 20px;
            background: white;
            border-bottom: 1px solid #dde5ed;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0b2f4e;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        button {
            background: white;
            border: 1px solid #cbd6e4;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1e3b5a;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        button:hover {
            background: #f0f4fa;
            border-color: #9bb1c9;
        }
        button.primary {
            background: #1e3b5a;
            border-color: #1e3b5a;
            color: white;
        }
        button.primary:hover {
            background: #0f2a3f;
        }
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 12px 12px 12px 16px;
            gap: 12px;
        }
        .project-panel {
            width: 26%;
            min-width: 200px;
            background: #f8fafd;
            border-radius: 18px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2eaf2;
        }
        .search-box {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d0ddee;
            border-radius: 40px;
            font-size: 0.8rem;
            background: white;
            outline: none;
        }
        .filter-row {
            display: flex;
            gap: 4px;
            margin: 10px 0 8px;
            flex-wrap: wrap;
        }
        .filter-chip {
            background: white;
            border: 1px solid #cbdae9;
            border-radius: 40px;
            padding: 3px 10px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1f3d60;
            cursor: pointer;
            transition: 0.1s;
        }
        .filter-chip.active {
            background: #1e3b5a;
            color: white;
            border-color: #1e3b5a;
        }
        .project-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 4px;
        }
        .project-item {
            background: white;
            padding: 8px 10px;
            margin-bottom: 5px;
            border-radius: 12px;
            border: 1px solid #e0e9f2;
            cursor: pointer;
            transition: 0.1s;
        }
        .project-item:hover {
            background: #ecf3fc;
            border-color: #b4cae2;
        }
        .project-item.selected {
            background: #dde9f7;
            border-left: 4px solid #1e3b5a;
            border-color: #1e3b5a #d0deed #d0deed #d0deed;
        }
        .project-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: #112f4a;
            margin-bottom: 3px;
            word-break: break-word;
        }
        .project-model {
            font-size: 0.65rem;
            color: #567e9c;
            background: #e9f0f8;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 40px;
        }
        .tools-panel {
            width: 74%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }
        .tools-header {
            margin-bottom: 8px;
        }
        .tools-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0b2f4e;
            word-break: break-word;
        }
        .cards-container {
            display: flex;
            gap: 10px;
            flex: 1;
            min-height: 0;
            overflow: visible;
            margin-bottom: 8px;
        }
        .tool-card {
            flex: 1 1 0;
            min-width: 0;
            background: white;
            border-radius: 18px;
            border: 1px solid #e2eaf2;
            display: flex;
            flex-direction: column;
            max-height: 100%;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.02);
        }
        .card-header {
            padding: 12px 12px 6px;
            font-weight: 600;
            font-size: 0.95rem;
            background: #f9fcff;
            border-bottom: 1px solid #e2eaf2;
        }
        .card-header span {
            background: #e1ebf5;
            padding: 2px 8px;
            border-radius: 40px;
            font-size: 0.65rem;
            margin-left: 6px;
            color: #1e3b5a;
        }
        .tool-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px 10px;
            min-height: 0;
        }
        .tool-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #edf3f9;
            gap: 4px;
        }
        .tool-info {
            flex: 1;
            min-width: 0;
        }
        .tool-name {
            font-weight: 600;
            color: #1a3857;
            font-size: 0.8rem;
            word-break: break-word;
            line-height: 1.2;
        }
        .tool-spec {
            font-size: 0.65rem;
            color: #6b8aac;
            margin-top: 2px;
            word-break: break-word;
            white-space: normal;
        }
        .tool-qty {
            background: #e5effa;
            padding: 2px 6px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 500;
            color: #1e3b5a;
            white-space: nowrap;
        }
        .tool-actions {
            display: flex;
            gap: 3px;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .edit-mode-active .tool-actions {
            opacity: 1;
        }
        .tool-actions button {
            background: none;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 2px;
            color: #7e96b0;
        }
        .tool-actions button:hover {
            color: #1e3b5a;
        }
        .delete-tool:hover {
            color: #c00 !important;
        }
        .empty-tools {
            color: #a0b8cf;
            text-align: center;
            padding: 30px 10px;
            font-style: italic;
            font-size: 0.85rem;
        }
        .bottom-bar {
            padding: 8px 16px;
            background: #f8fbfe;
            border-top: 1px solid #d9e2ec;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .bottom-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bottom-right {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        .project-image-icon {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            background: #e9f0f8;
            border: 1px solid #b0c8dd;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }
        .project-image-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .project-image-icon span {
            font-size: 1rem;
            color: #6b8aac;
        }
        .bottom-center {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-right: auto;
        }
        .edit-mode-toggle {
            background: #e9f0f8;
            border-color: #9bb1c9;
        }
        .edit-mode-toggle.active {
            background: #1e3b5a;
            color: white;
            border-color: #1e3b5a;
        }
        .file-import {
            position: relative;
        }
        .file-import input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .image-modal.active {
            display: flex;
        }
        .image-modal-content {
            background: white;
            border-radius: 28px;
            padding: 20px 24px;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
        }
        .image-modal-content h3 {
            margin-bottom: 16px;
            color: #0b2f4e;
            font-size: 1rem;
        }
        .image-preview-large {
            width: 140px;
            height: 140px;
            border-radius: 14px;
            background: #e9f0f8;
            border: 1px solid #b0c8dd;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .image-preview-large img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .image-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 28px;
            padding: 20px 24px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
        }
        .modal-content h3 {
            margin-bottom: 16px;
            color: #0b2f4e;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            color: #1f4465;
            font-size: 0.8rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbdae9;
            border-radius: 30px;
            font-size: 0.85rem;
            outline: none;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .project-panel, .tools-panel { width: 100%; }
            .cards-container { flex-direction: column; }
            .tool-card { max-height: 300px; }
            .app-container { height: auto; min-height: 100vh; }
            .bottom-bar { flex-direction: row; flex-wrap: wrap; justify-content: center; }
            .bottom-left, .bottom-center, .bottom-right { margin: 0; }
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <header>
        <h1>🔧 维修工具库 · 数据分离版</h1>
        <div class="btn-group">
            <button class="primary" id="addProjectBtn">➕ 新增项目</button>
            <button id="exportBtn">📤 导出JSON备份</button>
            <button id="exportDataJsBtn">📥 导出data.js</button> <!-- 新增：导出data.js按钮 -->
            <div class="file-import">
                <button>📥 导入JSON</button>
                <input type="file" id="importFile" accept="application/json">
            </div>
        </div>
    </header>
    <div class="main-layout">
        <div class="project-panel">
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 搜索...">
            <div class="filter-row" id="modelFilters">
                <span class="filter-chip active" data-model="全部">全部</span>
                <span class="filter-chip" data-model="737">737</span>
                <span class="filter-chip" data-model="737/MAX">737/MAX</span>
                <span class="filter-chip" data-model="MAX">MAX</span>
                <span class="filter-chip" data-model="787">787</span>
            </div>
            <div class="project-list" id="projectList"></div>
        </div>
        <div class="tools-panel">
            <div class="tools-header">
                <h2 id="selectedProjectName">请选择一个项目</h2>
            </div>
            <div class="cards-container" id="toolCards"></div>
        </div>
    </div>
    <div class="bottom-bar">
        <div class="bottom-left">
            <button id="saveLocalBtn">💾 保存到浏览器</button>
            <button id="resetBtn">🔄 重置</button>
        </div>
        <div class="bottom-center">
            <button id="editModeToggle" class="edit-mode-toggle">✏️ 编辑模式</button>
            <button id="addToolBtn" disabled>➕ 新增工具</button>
        </div>
        <div class="bottom-right">
            <div class="project-image-icon" id="imageIcon" title="项目图片">
                <span id="iconPlaceholder">🖼️</span>
                <img id="iconImg" src="" style="display: none;">
            </div>
        </div>
    </div>
</div>
<!-- 图片管理模态框 -->
<div class="image-modal" id="imageModal">
    <div class="image-modal-content">
        <h3>项目图片</h3>
        <div class="image-preview-large" id="largeImagePreview">
            <img src="" alt="预览" id="largeImg">
        </div>
        <div class="image-modal-actions">
            <button id="uploadImageBtn">📎 上传</button>
            <button id="removeImageBtn">❌ 移除</button>
            <button id="closeImageModal">关闭</button>
            <input type="file" id="imageUpload" accept="image/*" style="display: none;">
        </div>
    </div>
</div>
<!-- 编辑/新增工具模态框 -->
<div class="modal" id="toolModal">
    <div class="modal-content">
        <h3 id="modalTitle">编辑工具</h3>
        <form id="toolForm" onsubmit="return false;">
            <input type="hidden" id="toolId">
            <div class="form-group">
                <label>工具名称 *</label>
                <input type="text" id="toolName" required>
            </div>
            <div class="form-group">
                <label>类型</label>
                <select id="toolType">
                    <option value="基础工具">基础工具</option>
                    <option value="化工品">化工品</option>
                    <option value="专用工具">专用工具</option>
                </select>
            </div>
            <div class="form-group">
                <label>规格/件号</label>
                <input type="text" id="toolSpec" placeholder="例如 5/16 或 M1B">
            </div>
            <div class="form-group">
                <label>数量</label>
                <input type="text" id="toolQty" value="1">
            </div>
            <div class="modal-actions">
                <button type="button" id="cancelModal">取消</button>
                <button type="submit" class="primary" id="saveTool">保存</button>
            </div>
        </form>
    </div>
</div>
<!-- 新增/编辑项目模态框 -->
<div class="modal" id="projectModal">
    <div class="modal-content">
        <h3 id="projectModalTitle">新增项目</h3>
        <form id="projectForm" onsubmit="return false;">
            <div class="form-group">
                <label>工作名称 *</label>
                <input type="text" id="projectName" required>
            </div>
            <div class="form-group">
                <label>机型</label>
                <input type="text" id="projectModel" placeholder="如 737/MAX">
            </div>
            <div class="form-group">
                <label>章节号</label>
                <input type="text" id="projectChapter">
            </div>
            <div class="modal-actions">
                <button type="button" id="cancelProjectModal">取消</button>
                <button type="submit" class="primary" id="saveProject">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 先加载外部数据文件 data.js -->
<script src="./data.js"></script>
<script>
(function() {
    // ---------- 核心修改：从 data.js 加载初始数据 ----------
    // 依赖外部 data.js 暴露的全局变量 toolLibraryData
    const INITIAL_DATA = window.toolLibraryData || { projects: [], toolsMap: {} };
    
    // ----- 全局变量 -----
    let projects = [];
    let toolsMap = {};
    let selectedProjectName = null;
    let currentSearch = '';
    let currentModelFilter = '全部';
    let editMode = false;
    const STORAGE_KEY = 'aviation_tools_db_final_v3';

    // ---------- 数据加载/保存逻辑 ----------
    function loadFromStorage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.projects && data.toolsMap) {
                    projects = data.projects;
                    toolsMap = data.toolsMap;
                    selectedProjectName = data.selectedProjectName && projects.find(p => p.name === data.selectedProjectName) 
                        ? data.selectedProjectName 
                        : (projects.length > 0 ? projects[0].name : null);
                    return;
                }
            } catch (e) {}
        }
        // 本地存储无数据时，从 data.js 加载初始数据
        projects = INITIAL_DATA.projects || [];
        toolsMap = INITIAL_DATA.toolsMap || {};
        selectedProjectName = projects.length > 0 ? projects[0].name : null;
    }

    function saveToStorage() {
        const data = { projects, toolsMap, selectedProjectName };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // 新增：导出最新数据为 data.js 文件（用于同步到GitHub）
    function exportDataJs() {
        const dataContent = `const toolLibraryData = ${JSON.stringify({ projects, toolsMap }, null, 2)};`;
        const blob = new Blob([dataContent], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'data.js';
        a.click();
        URL.revokeObjectURL(url);
        alert('✅ 已导出最新 data.js 文件，可直接替换原有文件！');
    }

    function resetToOriginal() {
        // 重置为 data.js 中的初始数据
        projects = INITIAL_DATA.projects || [];
        toolsMap = INITIAL_DATA.toolsMap || {};
        selectedProjectName = projects.length > 0 ? projects[0].name : null;
        editMode = false;
        document.getElementById('editModeToggle').classList.remove('active');
        renderProjectList();
        renderToolCards(selectedProjectName);
        updateImageIcon();
        saveToStorage();
    }

    // ---------- 原有核心逻辑（无修改） ----------
    function toggleEditMode() {
        editMode = !editMode;
        const btn = document.getElementById('editModeToggle');
        if (editMode) {
            btn.classList.add('active');
            btn.innerText = '✏️ 编辑模式 (开启)';
        } else {
            btn.classList.remove('active');
            btn.innerText = '✏️ 编辑模式';
        }
        if (selectedProjectName) {
            renderToolCards(selectedProjectName);
        }
    }

    function renderProjectList() {
        const filtered = projects.filter(p => {
            const matchSearch = currentSearch === '' || p.name.toLowerCase().includes(currentSearch.toLowerCase());
            const matchModel = currentModelFilter === '全部' || p.model === currentModelFilter;
            return matchSearch && matchModel;
        });
        const container = document.getElementById('projectList');
        container.innerHTML = filtered.map(p => {
            const selectedClass = (selectedProjectName === p.name) ? 'selected' : '';
            return `<div class="project-item ${selectedClass}" data-workname="${p.name}">
                <div class="project-name">${p.name}</div>
                <span class="project-model">${p.model || '—'}</span>
            </div>`;
        }).join('');
        container.querySelectorAll('.project-item').forEach(el => {
            el.addEventListener('click', () => {
                const wname = el.dataset.workname;
                if (wname) {
                    selectedProjectName = wname;
                    renderProjectList();
                    renderToolCards(wname);
                    updateImageIcon();
                    document.getElementById('addToolBtn').disabled = false;
                    document.getElementById('selectedProjectName').innerText = wname;
                    saveToStorage();
                }
            });
        });
    }

    function updateImageIcon() {
        const icon = document.getElementById('iconImg');
        const placeholder = document.getElementById('iconPlaceholder');
        const project = projects.find(p => p.name === selectedProjectName);
        if (project && project.image) {
            icon.src = project.image;
            icon.style.display = 'block';
            placeholder.style.display = 'none';
        } else {
            icon.style.display = 'none';
            placeholder.style.display = 'block';
        }
    }

    // 图片模态框逻辑（无修改）
    const imageModal = document.getElementById('imageModal');
    const largeImg = document.getElementById('largeImg');
    const imageUpload = document.getElementById('imageUpload');
    document.getElementById('imageIcon').addEventListener('click', () => {
        if (!selectedProjectName) {
            alert('请先选择一个项目');
            return;
        }
        const project = projects.find(p => p.name === selectedProjectName);
        if (project && project.image) {
            largeImg.src = project.image;
        } else {
            largeImg.src = '';
        }
        imageModal.classList.add('active');
    });
    document.getElementById('closeImageModal').addEventListener('click', () => {
        imageModal.classList.remove('active');
    });
    document.getElementById('uploadImageBtn').addEventListener('click', () => {
        imageUpload.click();
    });
    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file || !selectedProjectName) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const base64 = ev.target.result;
            const project = projects.find(p => p.name === selectedProjectName);
            if (project) {
                project.image = base64;
                updateImageIcon();
                largeImg.src = base64;
                saveToStorage();
            }
        };
        reader.readAsDataURL(file);
    });
    document.getElementById('removeImageBtn').addEventListener('click', () => {
        const project = projects.find(p => p.name === selectedProjectName);
        if (project) {
            project.image = '';
            updateImageIcon();
            largeImg.src = '';
            saveToStorage();
        }
    });
    imageModal.addEventListener('click', (e) => {
        if (e.target === imageModal) imageModal.classList.remove('active');
    });

    // 渲染工具卡片（无修改）
    function renderToolCards(workName) {
        const cardsDiv = document.getElementById('toolCards');
        if (!workName) {
            cardsDiv.innerHTML = `<div style="flex:1; text-align:center; color:#999; padding:30px 10px;">请选择一个项目</div>`;
            return;
        }
        const tools = toolsMap[workName];
        if (!tools || tools.length === 0) {
            cardsDiv.innerHTML = `<div style="flex:1; text-align:center; color:#999; padding:30px 10px;">暂无工具，请点击“新增工具”添加</div>`;
            return;
        }
        const grouped = { '基础工具': [], '化工品': [], '专用工具': [] };
        tools.forEach(t => {
            if (t.type === '基础工具') grouped['基础工具'].push(t);
            else if (t.type === '化工品') grouped['化工品'].push(t);
            else if (t.type === '专用工具') grouped['专用工具'].push(t);
            else grouped['专用工具'].push(t);
        });
        const editClass = editMode ? 'edit-mode-active' : '';
        cardsDiv.innerHTML = ['基础工具', '化工品', '专用工具'].map(cat => {
            const list = grouped[cat];
            if (list.length === 0) return '';
            return `<div class="tool-card">
                <div class="card-header">${cat} <span>${list.length}</span></div>
                <div class="tool-list ${editClass}">
                    ${list.map(t => {
                        const displayName = t.name + (t.spec ? ` (${t.spec})` : '') + (t.pn ? ` [${t.pn}]` : '');
                        return `<div class="tool-row" data-toolid="${t.id}">
                            <div class="tool-info">
                                <div class="tool-name">${displayName}</div>
                                <div class="tool-spec"></div>
                            </div>
                            <span class="tool-qty">${t.qty}</span>
                            <div class="tool-actions">
                                <button class="edit-tool" title="编辑">✏️</button>
                                <button class="delete-tool" title="删除">🗑️</button>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>`;
        }).join('');
        cardsDiv.querySelectorAll('.edit-tool').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const row = btn.closest('.tool-row');
                const toolId = row?.dataset.toolid;
                if (toolId && selectedProjectName) {
                    const tool = toolsMap[selectedProjectName].find(t => t.id === toolId);
                    if (tool) openToolModal(tool);
                }
            });
        });
        cardsDiv.querySelectorAll('.delete-tool').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const row = btn.closest('.tool-row');
                const toolId = row?.dataset.toolid;
                if (toolId && selectedProjectName) {
                    toolsMap[selectedProjectName] = toolsMap[selectedProjectName].filter(t => t.id !== toolId);
                    renderToolCards(selectedProjectName);
                    saveToStorage();
                }
            });
        });
    }

    // 工具模态框逻辑（无修改）
    const toolModal = document.getElementById('toolModal');
    const toolForm = document.getElementById('toolForm');
    const modalTitle = document.getElementById('modalTitle');
    const toolIdField = document.getElementById('toolId');
    const toolNameInput = document.getElementById('toolName');
    const toolTypeSelect = document.getElementById('toolType');
    const toolSpecInput = document.getElementById('toolSpec');
    const toolQtyInput = document.getElementById('toolQty');
    function openToolModal(tool = null) {
        modalTitle.innerText = tool ? '编辑工具' : '新增工具';
        if (tool) {
            toolIdField.value = tool.id;
            toolNameInput.value = tool.name || '';
            toolTypeSelect.value = tool.type || '基础工具';
            toolSpecInput.value = tool.spec || '';
            toolQtyInput.value = tool.qty || '1';
        } else {
            toolIdField.value = '';
            toolNameInput.value = '';
            toolTypeSelect.value = '基础工具';
            toolSpecInput.value = '';
            toolQtyInput.value = '1';
        }
        toolModal.classList.add('active');
    }
    function closeToolModal() {
        toolModal.classList.remove('active');
    }
    toolForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!selectedProjectName) {
            alert('请先选择一个项目');
            closeToolModal();
            return;
        }
        const id = toolIdField.value;
        const name = toolNameInput.value.trim();
        if (!name) {
            alert('工具名称不能为空');
            return;
        }
        const type = toolTypeSelect.value;
        const spec = toolSpecInput.value.trim();
        const qty = toolQtyInput.value.trim() || '1';
        if (id) {
            const tool = toolsMap[selectedProjectName].find(t => t.id === id);
            if (tool) {
                tool.name = name;
                tool.type = type;
                tool.spec = spec;
                tool.qty = qty;
            }
        } else {
            const newId = 't_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
            const newTool = {
                id: newId,
                name: name,
                type: type,
                spec: spec,
                pn: '',
                qty: qty,
                fullInfo: ''
            };
            if (!toolsMap[selectedProjectName]) toolsMap[selectedProjectName] = [];
            toolsMap[selectedProjectName].push(newTool);
        }
        renderToolCards(selectedProjectName);
        saveToStorage();
        closeToolModal();
    });
    document.getElementById('cancelModal').addEventListener('click', closeToolModal);
    toolModal.addEventListener('click', (e) => {
        if (e.target === toolModal) closeToolModal();
    });

    // 项目模态框逻辑（无修改）
    const projectModal = document.getElementById('projectModal');
    const projectForm = document.getElementById('projectForm');
    const projectNameInput = document.getElementById('projectName');
    const projectModelInput = document.getElementById('projectModel');
    const projectChapterInput = document.getElementById('projectChapter');
    function openProjectModal() {
        projectNameInput.value = '';
        projectModelInput.value = '';
        projectChapterInput.value = '';
        projectModal.classList.add('active');
    }
    function closeProjectModal() {
        projectModal.classList.remove('active');
    }
    projectForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = projectNameInput.value.trim();
        if (!name) {
            alert('工作名称不能为空');
            return;
        }
        if (projects.find(p => p.name === name)) {
            alert('该项目已存在，请使用其他名称');
            return;
        }
        const model = projectModelInput.value.trim();
        const chapter = projectChapterInput.value.trim();
        const newProject = { name, model, chapter, type: '', image: '' };
        projects.push(newProject);
        toolsMap[name] = [];
        saveToStorage();
        renderProjectList();
        closeProjectModal();
    });
    document.getElementById('cancelProjectModal').addEventListener('click', closeProjectModal);
    document.getElementById('addProjectBtn').addEventListener('click', openProjectModal);
    projectModal.addEventListener('click', (e) => {
        if (e.target === projectModal) closeProjectModal();
    });

    // 搜索和过滤逻辑（无修改）
    document.getElementById('searchInput').addEventListener('input', (e) => {
        currentSearch = e.target.value;
        renderProjectList();
    });
    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentModelFilter = chip.dataset.model;
            renderProjectList();
        });
    });

    // 导出/导入逻辑（无修改）
    document.getElementById('exportBtn').addEventListener('click', () => {
        const data = { projects, toolsMap };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tools_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    });
    document.getElementById('importFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.projects && data.toolsMap) {
                    projects = data.projects;
                    toolsMap = data.toolsMap;
                    selectedProjectName = data.selectedProjectName && projects.find(p => p.name === data.selectedProjectName) 
                        ? data.selectedProjectName 
                        : (projects.length > 0 ? projects[0].name : null);
                    editMode = false;
                    document.getElementById('editModeToggle').classList.remove('active');
                    renderProjectList();
                    renderToolCards(selectedProjectName);
                    updateImageIcon();
                    saveToStorage();
                    alert('导入成功');
                } else throw new Error();
            } catch {
                alert('导入失败，无效的JSON格式');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    // 按钮绑定（新增导出data.js按钮事件）
    document.getElementById('addToolBtn').addEventListener('click', () => {
        if (!selectedProjectName) {
            alert('请先选择一个项目');
            return;
        }
        openToolModal(null);
    });
    document.getElementById('editModeToggle').addEventListener('click', toggleEditMode);
    document.getElementById('saveLocalBtn').addEventListener('click', () => {
        saveToStorage();
        alert('已保存到浏览器本地存储！');
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm('重置将丢失所有修改，恢复为 data.js 中的初始数据，确定吗？')) {
            resetToOriginal();
        }
    });
    document.getElementById('exportDataJsBtn').addEventListener('click', exportDataJs);

    // 初始化
    loadFromStorage();
    renderProjectList();
    if (selectedProjectName) {
        renderToolCards(selectedProjectName);
        updateImageIcon();
        document.getElementById('addToolBtn').disabled = false;
        document.getElementById('selectedProjectName').innerText = selectedProjectName;
    } else {
        document.getElementById('selectedProjectName').innerText = '请选择一个项目';
    }
})();
</script>
</body>
</html>
